# PoC reproduction of meta/pyrefly .github/workflows/ci_mypy_primer_comment.yml
# (same trigger, permissions, and steps; the third-party comment-hider action is dropped)
name: "CI: mypy primer comment"

on:
  workflow_run:
    workflows:
      - "CI: mypy primer run"
    types:
      - completed

permissions: {}

jobs:
  comment:
    name: Comment PR from mypy_primer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts/primer_presets.py
            scripts/error_presets.json
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download diffs
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{ github.event.workflow_run.id }},
            });
            const [matchArtifact] = artifacts.data.artifacts.filter((artifact) =>
              artifact.name == "mypy_primer_diffs");

            const download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: "zip",
            });
            fs.writeFileSync("diff.zip", Buffer.from(download.data));

      - run: unzip diff.zip
      - run: |
          cat diff_*.txt | tee fulldiff.txt
      - name: Break the diff down by preset
        run: |
          python scripts/primer_presets.py fulldiff.txt | tee preset_summary.txt

      - name: Post comment
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const prNumber = parseInt(fs.readFileSync("pr_number.txt", { encoding: "utf8" }))
            console.log("would comment on #" + prNumber)
